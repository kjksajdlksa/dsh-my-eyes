name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag and VERSION must agree
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw "tag $tag does not match VERSION v$version" }
          "release_version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Static gate
        run: node scripts/verify.mjs

      - name: Build the self-update payload
        run: node scripts/release.mjs

      - name: Package the payload
        shell: pwsh
        run: |
          $zip = "dist/dsh-my-eyes-$env:release_version.zip"
          Compress-Archive -Path dist/latest/* -DestinationPath $zip -Force
          "payload_zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:release_version"
          $notes = @"
          Self-update payload for `我的眼睛` (My Eyes) $env:release_version.

          Install / upgrade from inside a session:

          ```text
          eyes { action: "update", source: "github:${{ github.repository }}", ref: "$tag" }
          ```

          The payload is the `dist/latest` layout: `eyes.ps1`, `index.js`, `tools/`, `scripts/`, locale files and a `MANIFEST.json` with a SHA-256 for every file.
          "@
          gh release create $tag $env:payload_zip --title "我的眼睛 $env:release_version" --notes $notes
