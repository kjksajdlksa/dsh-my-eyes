name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tag and VERSION must agree
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw "tag $tag does not match VERSION v$version" }
          Write-Host "publishing v$version"

      - name: Static gate
        run: node scripts/verify.mjs

      - name: Build the self-update payload
        run: node scripts/release.mjs

      - name: Package the payload
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "dist/dsh-my-eyes-$version.zip"
          Compress-Archive -Path dist/latest/* -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "archive was not created" }
          Write-Host "payload: $zip ($((Get-Item $zip).Length) bytes)"

      - name: Render release notes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $text = Get-Content .github/release-notes.md -Raw -Encoding UTF8
          $text = $text.Replace('{{version}}', $version).Replace('{{repo}}', '${{ github.repository }}').Replace('{{tag}}', "v$version")
          # gh reads the file as UTF-8; -Encoding utf8 would add a BOM on PowerShell 5.1.
          [System.IO.File]::WriteAllText("$PWD/dist/release-notes.md", $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release create $tag "dist/dsh-my-eyes-$version.zip" --title "My Eyes $version" --notes-file dist/release-notes.md
