name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: static gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version consistency and module syntax
        run: node scripts/verify.mjs

      - name: Build the self-update payload
        run: node scripts/release.mjs --dest ${{ runner.temp }}/release

      - name: Payload manifest and checksums
        run: node scripts/check-release.mjs ${{ runner.temp }}/release/latest
